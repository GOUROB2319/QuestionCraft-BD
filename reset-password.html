<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.local.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-gradient-to-b from-emerald-50 to-white min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center text-white">
                <span class="material-symbols-outlined text-2xl">lock_reset</span>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">পাসওয়ার্ড রিসেট</h1>
                <p class="text-gray-600 text-sm">নতুন পাসওয়ার্ড সেট করুন</p>
            </div>
        </div>

        <div id="status" class="hidden p-4 rounded-xl mb-4 text-sm"></div>

        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">নতুন পাসওয়ার্ড</label>
                <input id="password" type="password" minlength="8" required
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"
                    placeholder="কমপক্ষে ৮ অক্ষর" />
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">পাসওয়ার্ড নিশ্চিত করুন</label>
                <input id="confirmPassword" type="password" minlength="8" required
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"
                    placeholder="আবার লিখুন" />
            </div>
            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                সংরক্ষণ করুন
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-emerald-600 font-semibold hover:text-emerald-700">লগইন পেজে যান</a>
        </div>
    </div>

    <script>
        function setStatus(message, type) {
            const el = document.getElementById('status');
            el.classList.remove('hidden');
            el.textContent = message;
            el.className = 'p-4 rounded-xl mb-4 text-sm ' + (type === 'error'
                ? 'bg-red-50 text-red-700 border border-red-200'
                : 'bg-emerald-50 text-emerald-700 border border-emerald-200');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                setStatus('পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।', 'error');
                return;
            }

            // Supabase recovery links establish a session in the browser.
            const user = await auth.getCurrentUser().catch(() => null);
            if (!user) {
                setStatus('রিসেট লিঙ্কটি সঠিক নয় বা মেয়াদ শেষ। ইমেইল থেকে নতুন লিঙ্ক নিন।', 'error');
                return;
            }

            const result = await auth.updatePassword(password);
            if (result.success) {
                setStatus('✅ পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। এখন লগইন করুন।', 'success');
                setTimeout(() => {
                    window.location.href = CONFIG.resolvePath(CONFIG.PATHS.LOGIN);
                }, 1200);
            } else {
                setStatus('দুঃখিত, কিছু ভুল হয়েছে: ' + (result.error || 'Unknown error'), 'error');
            }
        });
    </script>
</body>
</html>
