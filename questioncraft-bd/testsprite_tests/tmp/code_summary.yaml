version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React
  - Next.js
  - Tailwind CSS
  - Radix UI
  - shadcn/ui
  - Supabase
  - Framer Motion
  - Lucide React
routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Landing page with features and workflow overview
  - path: /login
    file: app/(auth)/login/page.tsx
    auth_required: false
    description: User login page
  - path: /register
    file: app/(auth)/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /verify
    file: app/(auth)/verify/page.tsx
    auth_required: false
    description: Email verification page
  - path: /dashboard
    file: app/(dashboard)/dashboard/page.tsx
    auth_required: true
    description: Main user dashboard
  - path: /papers
    file: app/(dashboard)/papers/page.tsx
    auth_required: true
    description: List of created question papers
  - path: /questions
    file: app/(dashboard)/questions/page.tsx
    auth_required: true
    description: List of managed questions
  - path: /questions/create
    file: app/(dashboard)/questions/create/page.tsx
    auth_required: true
    description: Page to create a new question
  - path: /settings
    file: app/(dashboard)/settings/page.tsx
    auth_required: true
    description: User settings and profile management
  - path: /preview
    file: app/preview/page.tsx
    auth_required: false
    description: Preview page for question papers
  - path: /legal/terms
    file: app/legal/terms/page.tsx
    auth_required: false
    description: Terms of service
  - path: /legal/privacy
    file: app/legal/privacy/page.tsx
    auth_required: false
    description: Privacy policy
features:
  - name: User Authentication
    description: Login, Register, and Verify users using Supabase Auth
    files:
      - app/(auth)/login/page.tsx
      - app/(auth)/register/page.tsx
      - app/(auth)/verify/page.tsx
    entry_route: /login
    user_interactions:
      - Fill email and password in login form
      - Click login button
      - Fill registration details (name, email, password)
      - Click register button
    api_calls:
      - method: POST
        endpoint: /api/auth/login
    auth_required: false
  - name: Question Dashboard
    description: View stats and quick actions on the dashboard
    files:
      - app/(dashboard)/dashboard/page.tsx
    entry_route: /dashboard
    user_interactions:
      - Navigate through sidebar
      - View overview cards
    auth_required: true
  - name: Question Creation
    description: Create questions for different classes and subjects
    files:
      - app/(dashboard)/questions/create/page.tsx
    entry_route: /questions/create
    user_interactions:
      - Select class and subject
      - Input question text in Bengali
      - Select question type
      - Save question
    auth_required: true
  - name: PDF Export
    description: Download question papers as PDF in NCTB format
    files:
      - app/page.tsx
    entry_route: /
    user_interactions:
      - Click Download PDF button
    auth_required: false
known_limitations: []
