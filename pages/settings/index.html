<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.local.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <style>body {font-family: 'Hind Siliguri', sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto p-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">⚙️ সেটিংস</h1>
            
            <div class="space-y-8">
                <section>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">ব্যক্তিগত তথ্য</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">পুরো নাম</label>
                            <input type="text" id="fullName" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="আপনার নাম"/>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">প্রতিষ্ঠান</label>
                            <input type="text" id="institution" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="স্কুল/কলেজের নাম"/>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">ইমেইল</label>
                            <input type="email" id="email" class="w-full px-4 py-3 bg-gray-100 border-2 border-gray-200 rounded-xl" disabled/>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">ফোন নম্বর</label>
                            <input type="tel" id="phone" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="+880 1XXX-XXXXXX"/>
                        </div>
                    </div>
                </section>
                
                <section class="pt-8 border-t">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">পছন্দসমূহ</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                            <div>
                                <div class="font-semibold">Dark Mode</div>
                                <div class="text-sm text-gray-600">অন্ধকার থিম ব্যবহার করুন</div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" id="darkMode"/>
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-emerald-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                            <div>
                                <div class="font-semibold">ভাষা / Language</div>
                                <div class="text-sm text-gray-600">Interface language</div>
                            </div>
                            <select class="px-4 py-2 border-2 border-gray-200 rounded-lg">
                                <option>বাংলা</option>
                                <option>English</option>
                            </select>
                        </div>
                    </div>
                </section>
                
                <section class="pt-8 border-t">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Storage Info</h2>
                    <div class="p-4 bg-blue-50 rounded-xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-semibold">Google Drive</span>
                            <span class="text-sm text-gray-600">150 MB / 15 GB</span>
                        </div>
                        <div class="w-full bg-blue-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full w-[1%]"></div>
                        </div>
                    </div>
                </section>
                
                <div class="flex gap-4">
                    <button onclick="saveSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition-all">
                        পরিবর্তন সংরক্ষণ করুন
                    </button>
                    <button onclick="window.location.href='../dashboard/index.html'" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-8 py-3 rounded-xl transition-all">
                        বাতিল
                    </button>
                </div>
            </div>
            
            <div class="mt-8 pt-8 border-t">
                <a href="../dashboard/index.html" class="text-emerald-600 font-semibold hover:text-emerald-700 inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Dashboard এ ফিরে যান
                </a>
            </div>
        </div>
    </div>
    
    <script>
        async function loadSettings() {
            const ok = await auth.requireAuth(CONFIG.resolvePath(CONFIG.PATHS.LOGIN));
            if (!ok) return;

            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('fullName').value = user.user_metadata?.full_name || '';
                document.getElementById('institution').value = user.user_metadata?.institution || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('phone').value = user.user_metadata?.phone || '';
            }
        }
        
        async function saveSettings() {
            const result = await auth.updateProfile({
                full_name: document.getElementById('fullName').value,
                institution: document.getElementById('institution').value,
                phone: document.getElementById('phone').value
            });
            
            if (result.success) {
                alert('✅ সেটিংস সফলভাবে সংরক্ষণ করা হয়েছে!');
            } else {
                alert('Error: ' + result.error);
            }
        }
        
        loadSettings();
    </script>
</body>
</html>
