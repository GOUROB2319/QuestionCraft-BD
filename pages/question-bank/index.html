<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - QuestionCraft BD</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.local.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/question-manager.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f3b61",
                        "secondary": "#10B981"
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    
    <div class="max-w-7xl mx-auto p-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">📚 Question Bank</h1>
                    <p class="text-gray-600">আপনার সংরক্ষিত সকল প্রশ্ন এখানে</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="window.location.href='../create-question/ai-generator.html'" class="bg-gradient-to-r from-emerald-600 to-emerald-700 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined">auto_awesome</span>
                        AI Generator
                    </button>
                    <button onclick="createNewQuestion()" class="bg-primary text-white px-6 py-3 rounded-xl font-semibold hover:bg-primary/90 transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined">add</span>
                        New Question
                    </button>
                </div>
            </div>
            
            <!-- Filters -->
            <div class="mb-6 grid md:grid-cols-4 gap-4">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                    <input id="searchInput" type="text" placeholder="প্রশ্ন খুঁজুন..." class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" onkeyup="filterQuestions()"/>
                </div>
                
                <select id="subjectFilter" class="px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" onchange="filterQuestions()">
                    <option value="">সব বিষয়</option>
                    <option value="পদার্থবিজ্ঞান">পদার্থবিজ্ঞান</option>
                    <option value="রসায়ন">রসায়ন</option>
                    <option value="গণিত">গণিত</option>
                    <option value="জীববিজ্ঞান">জীববিজ্ঞান</option>
                    <option value="বাংলা">বাংলা</option>
                    <option value="ইংরেজি">ইংরেজি</option>
                </select>
                
                <select id="classFilter" class="px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" onchange="filterQuestions()">
                    <option value="">সব শ্রেণী</option>
                    <option value="6">ষষ্ঠ</option>
                    <option value="7">সপ্তম</option>
                    <option value="8">অষ্টম</option>
                    <option value="9">নবম</option>
                    <option value="10">দশম</option>
                    <option value="11">একাদশ</option>
                    <option value="12">দ্বাদশ</option>
                </select>
                
                <select id="typeFilter" class="px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" onchange="filterQuestions()">
                    <option value="">সব ধরন</option>
                    <option value="mcq">MCQ</option>
                    <option value="creative">সৃজনশীল</option>
                    <option value="short">সংক্ষিপ্ত</option>
                </select>
            </div>
            
            <!-- Stats -->
            <div class="grid md:grid-cols-4 gap-4 mb-8">
                <div class="bg-gradient-to-r from-blue-50 to-blue-100 p-4 rounded-xl">
                    <div class="text-sm text-blue-600 font-semibold">মোট প্রশ্ন</div>
                    <div id="totalCount" class="text-3xl font-bold text-blue-700">০</div>
                </div>
                <div class="bg-gradient-to-r from-green-50 to-green-100 p-4 rounded-xl">
                    <div class="text-sm text-green-600 font-semibold">MCQ</div>
                    <div id="mcqCount" class="text-3xl font-bold text-green-700">০</div>
                </div>
                <div class="bg-gradient-to-r from-purple-50 to-purple-100 p-4 rounded-xl">
                    <div class="text-sm text-purple-600 font-semibold">সৃজনশীল</div>
                    <div id="creativeCount" class="text-3xl font-bold text-purple-700">০</div>
                </div>
                <div class="bg-gradient-to-r from-amber-50 to-amber-100 p-4 rounded-xl">
                    <div class="text-sm text-amber-600 font-semibold">অন্যান্য</div>
                    <div id="otherCount" class="text-3xl font-bold text-amber-700">০</div>
                </div>
            </div>
            
            <!-- Questions List -->
            <div id="questionsList" class="space-y-4">
                <!-- Questions will be loaded here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="text-center py-16">
                <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-gray-400 text-5xl">folder_open</span>
                </div>
                <h3 class="text-2xl font-bold text-gray-700 mb-3">কোনো প্রশ্ন নেই</h3>
                <p class="text-gray-500 mb-8 text-lg">AI দিয়ে প্রশ্ন তৈরি করুন বা manually যোগ করুন</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="window.location.href='../create-question/ai-generator.html'" class="bg-gradient-to-r from-emerald-600 to-emerald-700 text-white px-8 py-4 rounded-xl font-bold hover:shadow-xl transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined">auto_awesome</span>
                        AI দিয়ে তৈরি করুন
                    </button>
                    <button onclick="createNewQuestion()" class="bg-white border-2 border-gray-200 text-gray-700 px-8 py-4 rounded-xl font-bold hover:bg-gray-50 transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined">add</span>
                        নতুন প্রশ্ন যোগ করুন
                    </button>
                </div>
            </div>
            
            <!-- Back Button -->
            <div class="mt-8 pt-8 border-t">
                <a href="../dashboard/index.html" class="text-emerald-600 font-semibold hover:text-emerald-700 inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Dashboard এ ফিরে যান
                </a>
            </div>
        </div>
    </div>
    
    <script>
        let allQuestions = [];
        
        async function loadQuestions() {
            const ok = await auth.requireAuth(CONFIG.resolvePath(CONFIG.PATHS.LOGIN));
            if (!ok) return;

            // Prefer server truth if available
            await questionManager.refreshFromSupabase().catch(() => {});

            // Load questions from questionManager
            allQuestions = await questionManager.list();
            displayQuestions(allQuestions);
            updateStats();
        }
        
        function displayQuestions(questions) {
            const container = document.getElementById('questionsList');
            const emptyState = document.getElementById('emptyState');
            
            if (questions.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            container.innerHTML = questions.map((q, index) => `
                <div class="bg-gradient-to-r from-gray-50 to-white border-l-4 border-emerald-500 p-6 rounded-xl hover:shadow-lg transition-all group">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">${utils.escapeHtml(q.type?.toUpperCase() || 'MCQ')}</span>
                                ${q.subject ? `<span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold">${utils.escapeHtml(q.subject)}</span>` : ''}
                                ${q.class ? `<span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold">Class ${utils.escapeHtml(q.class)}</span>` : ''}
                            </div>
                            <h3 class="text-lg font-bold text-gray-900 mb-2">${index + 1}. ${utils.escapeHtml(q.question || q.title || 'প্রশ্ন')}</h3>
                            ${q.options ? `
                                <div class="space-y-1 text-sm text-gray-600 ml-4">
                                    ${q.options.map(opt => `<div>${utils.escapeHtml(opt)}</div>`).join('')}
                                </div>
                            ` : ''}
                            ${q.correctAnswer ? `
                                <div class="mt-2 text-sm">
                                    <span class="text-emerald-600 font-semibold">✓ সঠিক উত্তর: ${utils.escapeHtml(q.correctAnswer)}</span>
                                </div>
                            ` : ''}
                        </div>
                        
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editQuestion('${q.id}')" class="p-2 hover:bg-blue-50 text-blue-600 rounded-lg transition-all" title="Edit">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button onclick="deleteQuestion('${q.id}')" class="p-2 hover:bg-red-50 text-red-600 rounded-lg transition-all" title="Delete">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                            <button onclick="addToPaper('${q.id}')" class="p-2 hover:bg-green-50 text-green-600 rounded-lg transition-all" title="Add to Paper">
                                <span class="material-symbols-outlined">add_circle</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4 text-xs text-gray-500 mt-3 pt-3 border-t border-gray-100">
                        <div class="flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">calendar_today</span>
                            ${new Date(q.createdAt || Date.now()).toLocaleDateString('bn-BD')}
                        </div>
                        ${q.marks ? `<div>নম্বর: ${q.marks}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function filterQuestions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const subject = document.getElementById('subjectFilter').value;
            const classLevel = document.getElementById('classFilter').value;
            const type = document.getElementById('typeFilter').value;
            
            const filtered = allQuestions.filter(q => {
                const matchSearch = !search || (q.question || '').toLowerCase().includes(search);
                const matchSubject = !subject || q.subject === subject;
                const matchClass = !classLevel || q.class === classLevel;
                const matchType = !type || q.type === type;
                
                return matchSearch && matchSubject && matchClass && matchType;
            });
            
            displayQuestions(filtered);
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = allQuestions.length;
            document.getElementById('mcqCount').textContent = allQuestions.filter(q => q.type === 'mcq').length;
            document.getElementById('creativeCount').textContent = allQuestions.filter(q => q.type === 'creative').length;
            document.getElementById('otherCount').textContent = allQuestions.filter(q => q.type !== 'mcq' && q.type !== 'creative').length;
        }
        
        function createNewQuestion() {
            window.location.href = '../create-question/ai-generator.html';
        }
        
        function editQuestion(id) {
            alert('Edit functionality coming soon! Question ID: ' + id);
        }
        
        async function deleteQuestion(id) {
            if (confirm('এই প্রশ্নটি মুছে ফেলতে চান?')) {
                await questionManager.delete(id);
                await loadQuestions();
            }
        }
        
        function addToPaper(id) {
            alert('Add to paper functionality coming soon! Question ID: ' + id);
        }
        
        // Load questions on page load
        loadQuestions();
    </script>
</body>
</html>
