<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Papers - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.local.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/paper-manager.js"></script>
    <style>body {font-family: 'Hind Siliguri', sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto p-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">📁 আমার প্রশ্নপত্র</h1>
                    <p class="text-gray-600">আপনার তৈরি সকল প্রশ্নপত্র এখানে দেখুন</p>
                </div>
                <button onclick="window.location.href='../create-paper/index.html'" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-semibold flex items-center gap-2">
                    <span class="material-symbols-outlined">add</span>
                    নতুন প্রশ্নপত্র
                </button>
            </div>
            
            <div id="papersList" class="space-y-4">
                <!-- Papers will be loaded here -->
            </div>
            
            <div id="emptyState" class="text-center py-16">
                <div class="text-6xl mb-6">📄</div>
                <h3 class="text-2xl font-bold text-gray-700 mb-3">কোনো প্রশ্নপত্র নেই</h3>
                <p class="text-gray-500 mb-8 text-lg">আপনার প্রথম প্রশ্নপত্র তৈরি করুন</p>
                <button onclick="window.location.href='../create-paper/index.html'" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-xl font-bold inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">add</span>
                    প্রশ্নপত্র তৈরি করুন
                </button>
            </div>
            
            <div class="mt-8 pt-8 border-t">
                <a href="../dashboard/index.html" class="text-emerald-600 font-semibold hover:text-emerald-700 inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Dashboard এ ফিরে যান
                </a>
            </div>
        </div>
    </div>
    
    <script>
        async function loadPapers() {
            const ok = await auth.requireAuth(CONFIG.resolvePath(CONFIG.PATHS.LOGIN));
            if (!ok) return;

            await paperManager.refreshFromSupabase().catch(() => {});

            const papers = await paperManager.listPapers();
            const container = document.getElementById('papersList');
            const emptyState = document.getElementById('emptyState');
            
            if (papers.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            container.innerHTML = papers.map((paper, index) => `
                <div class="bg-gradient-to-r from-white to-gray-50 border-l-4 border-emerald-500 p-6 rounded-xl hover:shadow-lg transition-all group">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold">${utils.escapeHtml(paper.subject || 'Subject')}</span>
                                <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold">Class ${utils.escapeHtml(paper.class || '10')}</span>
                                <span class="px-3 py-1 ${paper.status === 'draft' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'} rounded-full text-xs font-bold">
                                    ${paper.status === 'draft' ? 'Draft' : 'Published'}
                                </span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">${utils.escapeHtml(paper.title)}</h3>
                            <div class="flex gap-4 text-sm text-gray-600">
                                <div>নম্বর: ${paper.totalMarks || 100}</div>
                                <div>সময়: ${paper.duration || 180} মিনিট</div>
                                <div>প্রশ্ন: ${paper.questions?.length || 0}টি</div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            <button onclick="editPaper('${paper.id}')" class="p-3 hover:bg-blue-50 text-blue-600 rounded-lg transition-all" title="Edit">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button onclick="exportPDF('${paper.id}')" class="p-3 hover:bg-green-50 text-green-600 rounded-lg transition-all" title="Export PDF">
                                <span class="material-symbols-outlined">download</span>
                            </button>
                            <button onclick="deletePaper('${paper.id}')" class="p-3 hover:bg-red-50 text-red-600 rounded-lg transition-all" title="Delete">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4 text-xs text-gray-500 mt-4 pt-4 border-t">
                        <div class="flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">calendar_today</span>
                            ${new Date(paper.createdAt || Date.now()).toLocaleDateString('bn-BD')}
                        </div>
                        ${paper.institution ? `<div>• ${utils.escapeHtml(paper.institution)}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function editPaper(id) {
            alert('Edit functionality coming soon! Paper ID: ' + id);
        }
        
        function exportPDF(id) {
            alert('PDF export functionality coming soon! Paper ID: ' + id);
        }
        
        async function deletePaper(id) {
            if (confirm('এই প্রশ্নপত্রটি মুছে ফেলতে চান?')) {
                await paperManager.deletePaper(id);
                loadPapers();
            }
        }
        
        loadPapers();
    </script>
</body>
</html>
