<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Paper - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.local.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/paper-manager.js"></script>
    <style>body {font-family: 'Hind Siliguri', sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-5xl mx-auto p-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">📝 নতুন প্রশ্নপত্র তৈরি করুন</h1>
                <p class="text-gray-600">প্রয়োজনীয় তথ্য দিয়ে আপনার প্রশ্নপত্র তৈরি করুন</p>
            </div>
            
            <form id="paperForm" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">পরীক্ষার নাম *</label>
                        <input type="text" id="paperTitle" required class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="যেমন: মাধ্যমিক পরীক্ষা - পদার্থবিজ্ঞান ১ম পত্র"/>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">বিষয় *</label>
                        <select id="subject" required class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">নির্বাচন করুন</option>
                            <option value="পদার্থবিজ্ঞান">পদার্থবিজ্ঞান</option>
                            <option value="রসায়ন">রসায়ন</option>
                            <option value="গণিত">গণিত</option>
                            <option value="জীববিজ্ঞান">জীববিজ্ঞান</option>
                            <option value="বাংলা">বাংলা</option>
                            <option value="ইংরেজি">ইংরেজি</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">শ্রেণী *</label>
                        <select id="classLevel" required class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">নির্বাচন করুন</option>
                            <option value="6">ষষ্ঠ</option>
                            <option value="7">সপ্তম</option>
                            <option value="8">অষ্টম</option>
                            <option value="9">নবম</option>
                            <option value="10">দশম</option>
                            <option value="11">একাদশ</option>
                            <option value="12">দ্বাদশ</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">মোট নম্বর</label>
                        <input type="number" id="totalMarks" value="100" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"/>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">সময় (মিনিট)</label>
                        <input type="number" id="duration" value="180" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none"/>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">প্রতিষ্ঠানের নাম</label>
                        <input type="text" id="institution" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="যেমন: ঢাকা কলেজ"/>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                        প্রশ্নপত্র তৈরি করুন
                    </button>
                    <button type="button" onclick="window.location.href='../dashboard/index.html'" class="px-8 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 rounded-xl transition-all">
                        বাতিল
                    </button>
                </div>
            </form>
            
            <div class="mt-8 pt-8 border-t">
                <a href="../dashboard/index.html" class="text-emerald-600 font-semibold hover:text-emerald-700 inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Dashboard এ ফিরে যান
                </a>
            </div>
        </div>
    </div>
    
    <script>
        (async () => {
            const ok = await auth.requireAuth(CONFIG.resolvePath(CONFIG.PATHS.LOGIN));
            if (!ok) return;
        })();

        document.getElementById('paperForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const paperData = {
                title: document.getElementById('paperTitle').value,
                subject: document.getElementById('subject').value,
                class: document.getElementById('classLevel').value,
                totalMarks: document.getElementById('totalMarks').value,
                duration: document.getElementById('duration').value,
                institution: document.getElementById('institution').value,
                questions: []
            };
            
            const result = await paperManager.createPaper(paperData);
            
            if (result.success) {
                alert('✅ প্রশ্নপত্র সফলভাবে তৈরি হয়েছে!');
                window.location.href = '../my-papers/index.html';
            } else {
                alert('Error: ' + result.error);
            }
        });
    </script>
</body>
</html>
