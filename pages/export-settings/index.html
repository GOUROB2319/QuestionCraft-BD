<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Export PDF - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../css/global.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-display text-slate-900 overflow-hidden">
    <!-- Modal Backdrop -->
    <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-fade-in">
        <!-- Premium Modal -->
        <div
            class="glass dark:glass-dark w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-scale-in border border-white/20">
            <!-- Modal Header -->
            <div
                class="px-8 py-6 border-b border-white/10 flex items-center justify-between bg-gradient-to-r from-emerald-500/10 to-teal-500/10">
                <h3 class="text-2xl font-bold font-bengali flex items-center gap-3 text-gradient">
                    <span class="material-symbols-outlined text-3xl">picture_as_pdf</span>
                    PDF Export Settings
                </h3>
                <button onclick="window.history.back()"
                    class="p-2 hover:bg-red-500/10 hover:text-red-500 rounded-full transition-all text-slate-400">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-8 md:px-12 custom-scrollbar">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <!-- Settings Column -->
                    <div class="space-y-10">
                        <!-- Basic Config -->
                        <div class="grid grid-cols-2 gap-6">
                            <div class="space-y-3">
                                <label
                                    class="text-sm font-bold text-slate-500 dark:text-slate-400 font-bengali tracking-wide">Paper
                                    Size</label>
                                <select
                                    class="w-full glass dark:glass-dark border border-white/10 rounded-2xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500/20 transition-all font-bengali">
                                    <option>A4 (Standard)</option>
                                    <option>Legal</option>
                                    <option>Letter</option>
                                </select>
                            </div>
                            <div class="space-y-3">
                                <label
                                    class="text-sm font-bold text-slate-500 dark:text-slate-400 font-bengali tracking-wide">Layout</label>
                                <select
                                    class="w-full glass dark:glass-dark border border-white/10 rounded-2xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500/20 transition-all font-bengali">
                                    <option>One Column</option>
                                    <option>Two Columns</option>
                                </select>
                            </div>
                        </div>

                        <!-- Toggles -->
                        <div class="space-y-5">
                            <label
                                class="text-sm font-bold text-slate-500 dark:text-slate-400 font-bengali tracking-wide">Document
                                Elements</label>
                            <div class="space-y-4">
                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all cursor-pointer group">
                                    <span
                                        class="text-sm font-semibold font-bengali group-hover:text-emerald-500 transition-colors">Include
                                        Institution Header</span>
                                    <input checked type="checkbox" class="w-5 h-5 accent-emerald-500">
                                </label>
                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all cursor-pointer group">
                                    <span
                                        class="text-sm font-semibold font-bengali group-hover:text-emerald-500 transition-colors">Include
                                        Watermark</span>
                                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                                </label>
                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all cursor-pointer group">
                                    <span
                                        class="text-sm font-semibold font-bengali group-hover:text-emerald-500 transition-colors">Show
                                        Answer Key</span>
                                    <input checked type="checkbox" class="w-5 h-5 accent-emerald-500">
                                </label>
                            </div>
                        </div>

                        <!-- Font Size Slider -->
                        <div class="space-y-5">
                            <div class="flex justify-between items-center">
                                <label
                                    class="text-sm font-bold text-slate-500 dark:text-slate-400 font-bengali tracking-wide">Font
                                    Size</label>
                                <span
                                    class="text-xs font-bold px-3 py-1 bg-emerald-500/10 text-emerald-500 rounded-full">11pt</span>
                            </div>
                            <input
                                class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                                max="16" min="8" type="range" value="11" />
                            <div
                                class="flex justify-between text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span>Small</span>
                                <span>Standard</span>
                                <span>Large</span>
                            </div>
                        </div>
                    </div>

                    <!-- Live Preview Column -->
                    <div
                        class="bg-slate-900/5 dark:bg-white/5 rounded-3xl p-8 border border-white/10 flex flex-col items-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6">Live Paper
                            Preview</p>
                        <div
                            class="bg-white w-full aspect-[1/1.414] rounded shadow-2xl p-6 relative overflow-hidden paper-sheet border border-slate-200">
                            <!-- Preview Content Skeleton -->
                            <div class="border-b-2 border-emerald-500/20 pb-4 mb-6 text-center">
                                <div class="h-3 w-32 bg-slate-200 mx-auto rounded-full mb-2"></div>
                                <div class="h-2 w-24 bg-slate-100 mx-auto rounded-full"></div>
                            </div>
                            <div class="space-y-6">
                                <div class="flex gap-6">
                                    <div class="flex-1 space-y-3">
                                        <div class="h-2 bg-slate-200 w-3/4 rounded-full"></div>
                                        <div class="h-1.5 w-full bg-slate-100 rounded-full"></div>
                                        <div class="h-1.5 w-5/6 bg-slate-100 rounded-full"></div>
                                    </div>
                                    <div class="flex-1 space-y-3">
                                        <div class="h-2 bg-slate-200 w-3/4 rounded-full"></div>
                                        <div class="h-1.5 w-full bg-slate-100 rounded-full"></div>
                                        <div class="h-1.5 w-5/6 bg-slate-100 rounded-full"></div>
                                    </div>
                                </div>
                                <div class="h-px bg-slate-100 w-full my-6"></div>
                                <div class="space-y-4">
                                    <div class="h-2 bg-slate-200 w-1/2 rounded-full"></div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="h-1.5 w-full bg-slate-50 rounded-full"></div>
                                        <div class="h-1.5 w-full bg-slate-50 rounded-full"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Watermark -->
                            <div
                                class="absolute inset-0 flex items-center justify-center opacity-[0.05] pointer-events-none rotate-[-45deg]">
                                <span class="text-4xl font-black tracking-tighter">QUESTIONCRAFT BD</span>
                            </div>
                        </div>
                        <p class="mt-6 text-[10px] text-slate-500 text-center italic font-medium px-4">
                            Real-time rendering reflects your chosen layout and theme settings.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-8 py-8 border-t border-white/5 flex items-center justify-end gap-4 bg-white/5">
                <button onclick="window.history.back()"
                    class="px-8 py-3 text-sm font-bold text-slate-500 hover:text-slate-900 transition-all">
                    Cancel
                </button>
                <button class="btn-premium flex items-center gap-2">
                    <span class="material-symbols-outlined">download_for_offline</span>
                    Generate PDF
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Background Content (Dashboard) -->
    <div class="flex h-screen overflow-hidden opacity-20 pointer-events-none grayscale">
        <aside class="w-64 flex flex-col border-r border-slate-200 bg-white">
            <div class="p-6">
                <div class="h-10 w-32 bg-slate-200 rounded-lg"></div>
            </div>
            <div class="flex-1 px-4 space-y-2 mt-4">
                <div class="h-10 w-full bg-slate-100 rounded-xl"></div>
                <div class="h-10 w-full bg-emerald-50 rounded-xl"></div>
                <div class="h-10 w-full bg-slate-100 rounded-xl"></div>
            </div>
        </aside>
        <main class="flex-1 flex flex-col">
            <header class="h-16 border-b border-slate-200"></header>
            <div class="p-8 space-y-8">
                <div class="h-12 w-1/3 bg-slate-200 rounded-full"></div>
                <div class="grid grid-cols-3 gap-6">
                    <div class="h-32 bg-slate-100 rounded-3xl"></div>
                    <div class="h-32 bg-slate-100 rounded-3xl"></div>
                    <div class="h-32 bg-slate-100 rounded-3xl"></div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
