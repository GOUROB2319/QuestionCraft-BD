<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - QuestionCraft BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.local.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[700px]">
        
        <!-- Left Panel -->
        <div class="md:w-5/12 gradient-bg p-12 text-white flex flex-col justify-between relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-3 mb-12">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                        <span class="material-symbols-outlined">psychology</span>
                    </div>
                    <span class="text-2xl font-bold">QuestionCraft <span class="text-emerald-200">BD</span></span>
                </div>
                
                <h1 class="text-5xl font-bold leading-tight mb-6">স্বাগতম<br/>ফিরে আসার জন্য</h1>
                <p class="text-emerald-50 text-lg leading-relaxed">আপনার স্মার্ট প্রশ্নপত্র তৈরির যাত্রা এখান থেকেই শুরু।</p>
            </div>
            
            <div class="relative z-10 text-sm text-white/60">
                © ২০২৪ QuestionCraft BD
            </div>
        </div>
        
        <!-- Right Panel - Login Form -->
        <div class="md:w-7/12 p-12 flex flex-col justify-center">
            
            <div class="max-w-md mx-auto w-full">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">লগইন করুন</h2>
                <p class="text-gray-500 mb-8">আপনার তথ্য দিয়ে প্রবেশ করুন</p>
                
                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">ইমেইল</label>
                        <input type="email" id="email" required 
                            class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                            placeholder="example@email.com"/>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">পাসওয়ার্ড</label>
                        <input type="password" id="password" required 
                            class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                            placeholder="••••••••"/>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="w-4 h-4 text-emerald-600 rounded"/>
                            <span class="ml-2 text-sm text-gray-600">মনে রাখুন</span>
                        </label>
                        <a href="#" class="text-sm font-semibold text-emerald-600 hover:text-emerald-700">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                    
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                        লগইন করুন
                    </button>
                </form>
                
                <div class="my-8 flex items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="px-4 text-sm text-gray-500">অথবা</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                
                <!-- Google OAuth -->
                <button onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 px-4 py-4 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition-all font-medium">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    </svg>
                    গুগল দিয়ে লগইন করুন
                </button>
                
                <p class="mt-8 text-center text-gray-500">
                    নতুন ব্যবহারকারী? <a href="signup.html" class="text-emerald-600 font-bold hover:text-emerald-700">একাউন্ট তৈরি করুন</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center">
            <div class="w-16 h-16 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-700 font-semibold">লগইন হচ্ছে...</p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loadingOverlay').classList.remove('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = await auth.signIn(email, password);
            
            if (result.success) {
                window.location.href = CONFIG.resolvePath(CONFIG.PATHS.DASHBOARD);
            } else {
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert('লগইন ব্যর্থ: ' + result.error);
            }
        });
        
        async function signInWithGoogle() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            await auth.signInWithGoogle();
        }
    </script>
</body>
</html>
